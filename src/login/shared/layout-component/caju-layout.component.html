<main class="tela-autenticacao" [class.alto-contraste]="altoContraste()" [style.--escala]="escalaFonte()">
  <section class="lado-marca" aria-label="Enfam — CAJU Biblioteca">
    @defer (on idle) {
    <app-cena-ascii-login [centralizada]="true" caju="lente"></app-cena-ascii-login>
    }

    <app-logos-orgaos class="orgaos" [reduzido]="true"></app-logos-orgaos>

    <div class="marca-conteudo">
      <img
        class="marca-caju"
        [src]="urlPublica('marca/caju-branca.svg')"
        alt="CAJU – Central de Atendimento ao Juiz Federal"
        width="171"
        height="63"
      />

      <p class="sr-only">
        CAJU · Biblioteca jurídica. Central de Atendimento aos Juízes Federais e Estaduais,
        mantida pelo STJ, pela Enfam e pelo CJF.
      </p>
    </div>
  </section>

  <section class="lado-form" aria-label="Conteúdo da autenticação">
    <nav class="controles-a11y" aria-label="Acessibilidade">
      <button type="button" [attr.aria-pressed]="altoContraste()" (click)="alternarAltoContraste()">
        <i class="fa-solid fa-circle-half-stroke"></i>
        Alto contraste
      </button>

      <button type="button" class="botao-vlibras" aria-label="Ativar tradutor em Libras (VLibras)"
        [attr.aria-busy]="vlibrasCarregando()" [disabled]="vlibrasCarregando()" (click)="ativarVlibras()">
        <i class="fa-regular fa-hand"></i>
        {{ vlibrasCarregando() ? 'Carregando VLibras…' : 'VLibras' }}
      </button>

      <button type="button" aria-label="Aumentar texto" (click)="aumentarFonte()">
        A
        <i class="fa-solid fa-plus"></i>
      </button>

      <button type="button" aria-label="Diminuir texto" (click)="diminuirFonte()">
        A
        <i class="fa-solid fa-minus"></i>
      </button>

      <a href="mailto:caju.biblioteca@stj.jus.br">Acessibilidade</a>
    </nav>

    <div class="painel-direito">
      <ng-content></ng-content>
    </div>
  </section>

  <div vw class="enabled vlibras-widget">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
</main>
