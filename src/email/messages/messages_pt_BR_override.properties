passwordResetSubject=Redefinição de senha — CAJU
passwordResetBody=Recebemos uma solicitação para redefinir a senha da sua conta {2}. Se foi você, acesse o link abaixo para criar uma nova senha: {0}. Este link expira em {3}. Se você não solicitou a redefinição, ignore esta mensagem. Sua senha não será alterada.
passwordResetBodyHtml=<p>Recebemos uma solicitação para redefinir a senha da sua conta <strong>{2}</strong>. Se foi você, clique no botão abaixo para criar uma nova senha.</p><p><a href="{0}" style="display:inline-block;padding:14px 26px;background-color:#d2b15f;color:#1d2c40;text-decoration:none;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:bold;border-radius:5px;">Redefinir minha senha</a></p><p style="color:#536176;font-size:13px;">Este link expira em <strong>{3}</strong> e poderá ser usado uma única vez.</p><p style="color:#536176;font-size:13px;">Se você não solicitou a redefinição, ignore esta mensagem. Sua senha não será alterada.</p>

executeActionsBody=Um administrador solicitou que você atualize sua conta {2} com a(s) seguinte(s) etapa(s): {3}.\n\nAcesse o link para iniciar o processo: {0}\n\nEste link expira em {4}.\n\nSe você não reconhece esta solicitação, ignore esta mensagem. Nenhuma alteração será feita.
executeActionsBodyHtml=<p>Um administrador solicitou que você atualize sua conta <strong>{2}</strong> com a(s) seguinte(s) etapa(s): <strong>{3}</strong>.</p><p>Clique no botão abaixo para iniciar o processo.</p><table role="presentation" border="0" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin:24px 0;"><tr><td bgcolor="#c49951" style="background-color:#c49951;border-radius:4px;"><a href="{0}" style="display:inline-block;padding:14px 26px;color:#1d2c40;text-decoration:none;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:bold;">Atualizar minha conta</a></td></tr></table><p>Este link expira em <strong>{4}</strong>.</p><p>Se você não reconhece esta solicitação, ignore esta mensagem. Nenhuma alteração será feita.</p>

emailOtpCodeSubject=[CAJU] Código de acesso
emailOtpCodeBody={0}.\n\nSegue seu código de acesso à CAJU:\n\n{1}\n\nEste código expira em 5 minutos.\n\nSe você não solicitou este código, ignore este e-mail.
emailOtpCodeBodyHtml=<p>{0}</p><p>Segue seu código de acesso à CAJU:</p><p style="margin:24px 0;padding:18px;background-color:#f3f5f8;border-left:4px solid #c49951;text-align:center;font-size:28px;font-weight:bold;letter-spacing:6px;color:#1d2c40;">{1}</p><p>Este código expira em <strong>5 minutos</strong>.</p><p>Se você não solicitou este código, ignore este e-mail.</p>

email.otp.error.expired=Seu código de acesso expirou. Solicite o envio de um novo código.
email.otp.error.invalidated=Você atingiu o limite de tentativas. Por segurança, o código atual foi desativado. Solicite um novo código de acesso.
email.otp.error.wrong=Código de acesso incorreto. Verifique os números digitados e tente novamente.
email.otp.error.wait=Aguarde 30 segundos antes de solicitar um novo código.
email.otp.error.email_send=Não foi possível enviar o e-mail com o código. Tente novamente mais tarde.
email.otp.success.resend=Um novo código foi enviado para o seu e-mail.