passwordResetSubject=Restablecimiento de contraseña — CAJU
passwordResetBody=Recibimos una solicitud para restablecer la contraseña de su cuenta {2}. Si usted realizó esta solicitud, use el enlace de abajo para crear una nueva contraseña: {0}. Este enlace caduca en {3}. Si no solicitó el restablecimiento, ignore este mensaje. Su contraseña no será modificada.
passwordResetBodyHtml=<p>Recibimos una solicitud para restablecer la contraseña de su cuenta <strong>{2}</strong>. Si usted realizó esta solicitud, haga clic en el botón para crear una nueva contraseña.</p><p><a href="{0}" style="display:inline-block;padding:14px 26px;background-color:#d2b15f;color:#1d2c40;text-decoration:none;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:bold;border-radius:5px;">Restablecer mi contraseña</a></p><p style="color:#536176;font-size:13px;">Este enlace caduca en <strong>{3}</strong> y solo puede utilizarse una vez.</p><p style="color:#536176;font-size:13px;">Si no solicitó el restablecimiento, ignore este mensaje. Su contraseña no será modificada.</p>

executeActionsBody=Un administrador solicitó que actualice su cuenta {2} con la(s) siguiente(s) acción(es): {3}.\n\nUse este enlace para iniciar el proceso: {0}\n\nEste enlace caduca en {4}.\n\nSi no reconoce esta solicitud, ignore este mensaje. No se realizarán cambios.
executeActionsBodyHtml=<p>Un administrador solicitó que actualice su cuenta <strong>{2}</strong> con la(s) siguiente(s) acción(es): <strong>{3}</strong>.</p><p>Haga clic en el botón para iniciar el proceso.</p><table role="presentation" border="0" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin:24px 0;"><tr><td bgcolor="#c49951" style="background-color:#c49951;border-radius:4px;"><a href="{0}" style="display:inline-block;padding:14px 26px;color:#1d2c40;text-decoration:none;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:bold;">Actualizar mi cuenta</a></td></tr></table><p>Este enlace caduca en <strong>{4}</strong>.</p><p>Si no reconoce esta solicitud, ignore este mensaje. No se realizarán cambios.</p>

emailOtpCodeSubject=[CAJU] Código de acceso
emailOtpCodeBody={0}.\n\nEste es su código de acceso a CAJU:\n\n{1}\n\nEste código caduca en 5 minutos.\n\nSi no solicitó este código, puede ignorar este correo electrónico.
emailOtpCodeBodyHtml=<p>{0}</p><p>Este es su código de acceso a CAJU:</p><p style="margin:24px 0;padding:18px;background-color:#f3f5f8;border-left:4px solid #c49951;text-align:center;font-size:28px;font-weight:bold;letter-spacing:6px;color:#1d2c40;">{1}</p><p>Este código caduca en <strong>5 minutos</strong>.</p><p>Si no solicitó este código, puede ignorar este correo electrónico.</p>

email.otp.error.expired=Su código de acceso ha caducado. Solicite un nuevo código.
email.otp.error.invalidated=Ha alcanzado el límite de intentos. Por su seguridad, el código actual ha sido desactivado. Solicite un nuevo código de acceso.
email.otp.error.wrong=El código de acceso es incorrecto. Verifique los números e inténtelo de nuevo.
email.otp.error.wait=Espere 30 segundos antes de solicitar un nuevo código.
email.otp.error.email_send=No se pudo enviar el correo electrónico con el código. Inténtelo de nuevo más tarde.
email.otp.success.resend=Se ha enviado un nuevo código a su correo electrónico.