passwordResetSubject=Password reset — CAJU
passwordResetBody=We received a request to reset the password for your {2} account. If you made this request, use the link below to create a new password: {0}. This link expires in {3}. If you did not request a reset, you can ignore this message. Your password will not be changed.
passwordResetBodyHtml=<p>We received a request to reset the password for your <strong>{2}</strong> account. If you made this request, click the button below to create a new password.</p><p><a href="{0}" style="display:inline-block;padding:14px 26px;background-color:#d2b15f;color:#1d2c40;text-decoration:none;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:bold;border-radius:5px;">Reset my password</a></p><p style="color:#536176;font-size:13px;">This link expires in <strong>{3}</strong> and can only be used once.</p><p style="color:#536176;font-size:13px;">If you did not request a reset, you can ignore this message. Your password will not be changed.</p>

executeActionsBody=An administrator asked you to update your {2} account with the following step(s): {3}.\n\nUse this link to get started: {0}\n\nThis link expires in {4}.\n\nIf you do not recognize this request, ignore this message. No changes will be made.
executeActionsBodyHtml=<p>An administrator asked you to update your <strong>{2}</strong> account with the following step(s): <strong>{3}</strong>.</p><p>Click the button below to get started.</p><table role="presentation" border="0" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin:24px 0;"><tr><td bgcolor="#c49951" style="background-color:#c49951;border-radius:4px;"><a href="{0}" style="display:inline-block;padding:14px 26px;color:#1d2c40;text-decoration:none;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:bold;">Update my account</a></td></tr></table><p>This link expires in <strong>{4}</strong>.</p><p>If you do not recognize this request, ignore this message. No changes will be made.</p>

emailOtpCodeSubject=[CAJU] Sign-in code
emailOtpCodeBody={0}.\n\nHere is your CAJU sign-in code:\n\n{1}\n\nThis code expires in 5 minutes.\n\nIf you did not request this code, you can ignore this email.
emailOtpCodeBodyHtml=<p>{0}</p><p>Here is your CAJU sign-in code:</p><p style="margin:24px 0;padding:18px;background-color:#f3f5f8;border-left:4px solid #c49951;text-align:center;font-size:28px;font-weight:bold;letter-spacing:6px;color:#1d2c40;">{1}</p><p>This code expires in <strong>5 minutes</strong>.</p><p>If you did not request this code, you can ignore this email.</p>

email.otp.error.expired=Your sign-in code has expired. Please request a new code.
email.otp.error.invalidated=You have reached the maximum number of attempts. For your security, the current code has been deactivated. Please request a new sign-in code.
email.otp.error.wrong=Incorrect sign-in code. Check the numbers and try again.
email.otp.error.wait=Please wait 30 seconds before requesting a new code.
email.otp.error.email_send=We couldn't send the email with your code. Please try again later.
email.otp.success.resend=A new code has been sent to your email address.